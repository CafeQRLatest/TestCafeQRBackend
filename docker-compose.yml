services:
  # Backend Service
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-pos_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-pos_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-pos_password}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-gmail-api}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-cafeqrllp@gmail.com}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-https://cafeqr-frontend.pages.dev}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      - SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE=25
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=5
      - SPRING_DATA_REDIS_HOST=redis
      - CLOUDFLARE_R2_ACCESS_KEY=${CLOUDFLARE_R2_ACCESS_KEY:-}
      - CLOUDFLARE_R2_SECRET_KEY=${CLOUDFLARE_R2_SECRET_KEY:-}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT:-}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:-}
      - CLOUDFLARE_R2_PUBLIC_URL=${CLOUDFLARE_R2_PUBLIC_URL:-}
      - WHATSAPP_GATEWAY_URL=${WHATSAPP_GATEWAY_URL:-http://whatsapp-gateway:3005}
    depends_on:
      - db
      - redis
      - whatsapp-gateway

  # Database Service
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-pos_db}
      - POSTGRES_USER=${DB_USER:-pos_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-pos_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # WAHA Core Service (Self-Hosted WhatsApp Engine)
  waha:
    image: devlikeapro/waha
    container_name: cafeqr-waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-cafeqr-waha-secret-2026}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_LOG_LEVEL=info
    volumes:
      - waha_sessions:/app/.sessions

  # Cafe QR WhatsApp Gateway Adapter
  whatsapp-gateway:
    build: ./whatsapp-gateway
    container_name: cafeqr-whatsapp-gateway
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      - WAHA_API_KEY=${WAHA_API_KEY:-cafeqr-waha-secret-2026}
      - WAHA_DEFAULT_SESSION=${WAHA_DEFAULT_SESSION:-cafe_qr_orders}
      - WAHA_TIMEOUT_MS=${WAHA_TIMEOUT_MS:-15000}
      - WHATSAPP_HOOK_HMAC_KEY=${WHATSAPP_HOOK_HMAC_KEY:-cafeqr-webhook-hmac-2026}
      - BACKEND_AUTO_CAPTURE_URL=http://backend:8080/api/v1/public/leads/auto-capture
      - FOUNDER_SECRET_KEY=${FOUNDER_SECRET_KEY:-cafeqr-founder-2024-secret}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - waha
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  waha_sessions:
