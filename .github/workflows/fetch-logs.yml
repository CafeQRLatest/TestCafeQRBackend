name: Fetch Backend Logs

on:
  workflow_dispatch:

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch logs from Oracle Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            echo "Checking status of all containers..."
            sudo docker ps
            echo "---------------------------------------------------"
            echo "Fetching the last 200 lines of ALL containers..."
            sudo docker compose logs --tail 200 2>/dev/null || sudo docker-compose logs --tail 200
            echo "---------------------------------------------------"
