name: Deploy Test Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cafeqrlatest/testcafeqrbackend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Backend Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Build and push WhatsApp Gateway Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/cafeqrlatest/testcafeqr-whatsapp-gateway:latest ./whatsapp-gateway
          docker push ${{ env.REGISTRY }}/cafeqrlatest/testcafeqr-whatsapp-gateway:latest

      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /home/ubuntu
            
            # Log in to GHCR on the Oracle server to pull the package
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull backend & whatsapp-gateway images
            sudo docker-compose pull test-backend || sudo docker compose pull test-backend || true
            sudo docker-compose pull whatsapp-gateway || sudo docker compose pull whatsapp-gateway || true
            
            # Restart backend & whatsapp-gateway services (leaving DB and Redis untouched)
            sudo docker-compose up -d test-backend || sudo docker compose up -d test-backend || true
            sudo docker-compose up -d whatsapp-gateway || sudo docker compose up -d whatsapp-gateway || true
            
            # Clean up old unused images to save disk space
            sudo docker image prune -f
